toggle:
  enabled: '&8&l» &fHas &aactivado &flas solicitudes de tradeo'
  disabled: '&8&l» &fHas &cdesactivado &flas solicitudes de tradeo'

# summary after a successful trade
summary:
  get:
    item: '&r &8&l» &r%item% &a+[x%amount%]'
    currency: '&r &8&l» &a+%amount% &b(%currency%)'
  give:
    item: '&r &8&l» &r%item% &c-[x%amount%]'
    currency: '&r &8&l» &c-%amount% &b(%currency%)'

currency-editor:
  success: '&8&l» &fValor cambiado con exito'
  failed: '&4&l» &cValor incorrecto'
  not-enough: '&4&l» &cNo tienes suficiente dinero para esto'

