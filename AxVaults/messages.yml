      name: '&#00CBF5Mochila #%num%'
      glow: false
      lore:
      - '&8Mochila'
      - ' '
      - '&fAquí podrás guardar los objetos'
      - '&fque desees'
      - ' '
      - '&r &8◆ &fEspacios: &b0&8/&b54'
