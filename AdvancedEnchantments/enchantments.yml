granjero:
  display: '%group-color%Granjero'
  description: "&fProbabilidad de cosechar en un radio 3x3."
  applies-to: Azadas
  type: MINING
  group: COMUN
  applies:
    - ALL_HOE
  levels:
    '1':
      settings:
        whitelist:
          - CROPS
          - WHEAT
          - CARROT
          - CARROTS
          - POTATO
          - POTATOES
          - BEETROOT
          - BEETROOTS
          - COCOA
          - NETHER_WART
          - NETHER_WARTS
          - TORCHFLOWER
          - PITCHER_CROP
      effects:
        - BREAK_BLOCK @Trench{r=3,it=true}
planter:
  display: '%group-color%Planter'
  description: |-
    &fProbabilidad de plantar semillas
    &fen un radio 3x3 haciendo 
    &bshift + clic izquierdo&f.
  applies-to: Azadas
  type: RIGHT_CLICK
  settings:
    showActionBar: true
  group: COMUN
  applies:
    - ALL_HOE
  levels:
    '1':
      conditions:
        - '%player is sneaking% = true : %allow%'
      effects:
        - PLANT_SEEDS:1
replanter:
  display: '%group-color%Replanter'
  description: |-
    &fProbabilidad de replantar
    &fla cosecha que hayas roto.
  applies-to: Azadas
  type: MINING
  group: COMUN
  applies:
    - ALL_HOE
  levels:
    '1':
      conditions:
        - '%is crop% = false : %stop%'
        - '%is fully grown% = false : %stop%'
      effects:
        - PLANT_SEEDS:0:%block drop type%
fundidor:
  display: '%group-color%Fundidor'
  description: |-
    &fProbabilidad de fundir las
    &fmenas que hayas minado.
  applies-to: Picos
  type: MINING
  group: COMUN
  applies:
    - ALL_PICKAXE
    - ALL_SHOVEL
  levels:
    '1':
      effects:
        - SMELT
carronero:
  display: '%group-color%Carroñero'
  description: |-
    &fProbabilidad de ganar dinero
    &fpor matar mobs.
  applies-to: Espadas
  type: ATTACK_MOB
  group: COMUN
  applies:
    - ALL_SWORD
  levels:
    '1':
      effects:
        - ADD_MONEY:10
    '2':
      effects:
        - ADD_MONEY:20
    '3':
      effects:
        - ADD_MONEY:30

