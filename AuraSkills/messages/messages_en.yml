abilities:
  bountiful_harvest:
    name: Bountiful Harvest
    desc: Grants +{value} Farming Luck, which increases the chance for extra drops.
    info: +{value} Farming Luck
  farmer:
    name: Farmer
    desc: Earn {value}% more Farming XP.
    info: +{value}% XP
  scythe_master:
    name: Scythe Master
    desc: Increases damage from hoes by {value}%.
    info: +{value}% Hoe Damage
  geneticist:
    name: Geneticist
    desc: Increases saturation gain from plant-based foods by {value}.
    info: +{value} Saturation
  growth_aura:
    name: Growth Aura
    desc: Crops with growth stages within {radius} blocks of you grow {value}% faster.
    info: +{value}% Growth
  lumberjack:
    name: Lumberjack
    desc: Grants +{value} Foraging Luck, which increases the chance for extra drops.
    info: +{value} Foraging Luck
  forager:
    name: Forager
    desc: Earn {value}% more Foraging XP.
    info: +{value}% XP
  axe_master:
    name: Axe Master
    desc: Increases damage from axes by {value}%
    info: +{value}% Axe Damage
  valor:
    name: Valor
    desc: Grants +{value} Strength while holding an axe.
    info: +{value} Strength
  shredder:
    name: Shredder
    desc: '{value}% chance to deal triple durability damage with axes.'
    info: '{value}% 3x Durability Damage'
  lucky_miner:
    name: Lucky Miner
    desc: Grants +{value} Mining Luck, which increases the chance for extra drops.
    info: +{value} Mining Luck
  miner:
    name: Miner
    desc: Earn {value}% more Mining XP.
    info: +{value}% XP
  pick_master:
    name: Pick Master
    desc: Deal {value}% more damage with pickaxes.
    info: +{value}% Pickaxe Damage
  stamina:
    name: Stamina
    desc: Grants +{value} Toughness while holding a pickaxe.
    info: +{value} Toughness
  hardened_armor:
    name: Hardened Armor
    desc: '{value}% chance to negate durability damage on armor.'
    info: '{value}% No Durability Loss'
  lucky_catch:
    name: Lucky Catch
    desc: Grants +{value} Fishing Luck, which increases the chance for extra drops.
    info: +{value} Fishing Luck
  fisher:
    name: Fisher
    desc: Earn {value}% more Fishing XP.
    info: +{value}% XP
  treasure_hunter:
    name: Treasure Hunter
    desc: '{value}% higher chance to get rare loot from fishing.'
    info: +{value}% Rare Loot
  grappler:
    name: Grappler
    desc: Hook entities with {value}% more speed.
    info: +{value}% Hook Speed
  epic_catch:
    name: Epic Catch
    desc: '{value}% added chance to get epic loot from fishing.'
    info: +{value}% Epic Loot
  metal_detector:
    name: Metal Detector
    desc: '{value}% added chance to get rare loot from digging.'
    info: +{value}% Rare Loot
  excavator:
    name: Excavator
    desc: Earn {value}% more Excavation XP.
    info: +{value}% XP
  spade_master:
    name: Spade Master
    desc: Deal {value}% more damage with shovels.
    info: +{value}% Shovel Damage
  bigger_scoop:
    name: Bigger Scoop
    desc: Grants +{value} Excavation Luck, which increases the chance for extra drops.
    info: +{value}% Excavation Luck
  lucky_spades:
    name: Lucky Spades
    desc: '{value}% added chance to get epic loot from digging.'
    info: +{value}% Epic Loot
  retrieval:
    name: Retrieval
    desc: Arrows you miss will be instantly retrieved after {time}s up to {value}
      blocks away.
    info: '{value} Distance'
  archer:
    name: Archer
    desc: Earn {value}% more Archery XP.
    info: +{value}% XP
  bow_master:
    name: Bow Master
    desc: Deal {value}% more damage with bows.
    info: +{value}% Bow Damage
  piercing:
    name: Piercing
    desc: '{value}% chance for arrows to pierce through mobs.'
    info: '{value}% Pierce Chance'
  stun:
    name: Stun
    desc: '{value}% chance to decreases enemy movement speed by 20% for 2 seconds.'
    info: '{value}% Stun Chance'
  shielding:
    name: Shielding
    desc: Reduce incoming damage by {value}% while sneaking.
    info: -{value}% Incoming Dmg Sneaking
  defender:
    name: Defender
    desc: Earn {value}% more Defense XP.
    info: +{value}% XP
  mob_master:
    name: Mob Master
    desc: Reduce incoming damage from mobs by {value}%
    info: -{value}% Mob Dmg
  immunity:
    name: Immunity
    desc: '{value}% chance to completely negate an enemy attack.'
    info: '{value}% Immune'
  no_debuff:
    name: No Debuff
    desc: '{value}% chance to negate a harmful potion effect from being applied.'
    info: '{value}% No Debuff'
  parry:
    name: Parry
    desc: Missing a sword swing within {time}s before being hit reduces damage by
      {value}% and cancels knockback.
    info: '{value}% Dmg Reduction'
    parried: <red>Attack parried
  fighter:
    name: Fighter
    desc: Earn {value}% more Fighting XP.
    info: +{value}% XP
  sword_master:
    name: Sword Master
    desc: Deal {value}% more damage with swords.
    info: +{value}% Sword Damage
  first_strike:
    name: First Strike
    desc: Deal {value}% more damage on the first hit.
    info: +{value}% Dmg First Hit
    dealt: <red>First Strike Dealt!
  bleed:
    name: Bleed
    desc: '{value}% chance to make the enemy bleed for {base_ticks} bleed ticks, dealing
      {value_2} damage per tick. {added_ticks} ticks are added to enemies already
      bleeding.'
    info: '{value}% Chance, {value_2} Damage'
    enemy_bleeding: <red>Enemy Bleeding!
    self_bleeding: <red>You are bleeding!
    stop: <white>The bleeding has stopped
  anti_hunger:
    name: Anti Hunger
    desc: '{value}% chance to stop hunger loss.'
    info: '{value}% No Hunger Loss'
  runner:
    name: Runner
    desc: Earn {value}% more Endurance XP.
    info: +{value}% XP
  golden_heal:
    name: Golden Heal
    desc: Increases regeneration effect health gain by {value}%
    info: +{value}% Effect Regen
  recovery:
    name: Recovery
    desc: Increases natural regeneration when at less than half health by {value}%
    info: +{value}% Low HP Regen
  meal_steal:
    name: Meal Steal
    desc: '{value}% chance to steal 1 hunger point when attacking a player.'
    info: '{value}% Hunger Steal'
  light_fall:
    name: Light Fall
    desc: Reduces all fall damage by {value}%
    info: -{value}% Fall Damage
  jumper:
    name: Jumper
    desc: Earn {value}% more Agility XP.
    info: +{value}% XP
  sugar_rush:
    name: Sugar Rush
    desc: Consumed and splashed speed and jump boost potions last {value}% longer.
    info: '{value}% Longer Speed'
  fleeting:
    name: Fleeting
    desc: Gain +{value} Speed when below 20% health.
    info: +{value}% Speed
    start: <white>You have gained a fleeting speed boost! <gray>(+{value}% Speed)
    end: <gray>Fleeting speed boost has worn off
  thunder_fall:
    name: Thunder Fall
    desc: When sneaking during a fall, you have a {value}% chance to deal {value_2}%
      of the fall damage expected to mobs in a 3 block radius.
    info: '{value}% Chance, {value_2}% Damage'
  alchemist:
    name: Alchemist
    desc: Potions you brew have a {value}% longer duration.
    info: +{value}% Potion Duration
  brewer:
    name: Brewer
    desc: Earn {value}% more Alchemy XP.
    info: +{value}% XP
  splasher:
    name: Splasher
    desc: Potions you splash gain {value}% longer duration for each player affected.
    info: +{value}% Duration/Player
  lingering:
    name: Lingering
    desc: Lingering potions naturally decay {value}% slower and decay {value_2}% less
      per affected entity.
    info: -{value}% Natural, -{value_2}% Entity Decay
  wise_effect:
    name: Wise Effect
    desc: Gain {value} Wisdom for every unique active potion effect.
    info: +{value} Wisdom/Effect
  xp_convert:
    name: XP Convert
    desc: Earn 1 Minecraft experience for every {value} skill XP you gain.
    info: 1 EXP/{value} Skill XP
  enchanter:
    name: Enchanter
    desc: Earn {value}% more Enchanting XP.
    info: +{value}% XP
  xp_warrior:
    name: XP Warrior
    desc: Mobs you kill have a {value}% chance of dropping double experience.
    info: '{value}% 2x Mob XP'
  enchanted_strength:
    name: Enchanted Strength
    desc: Gain {value} Strength for every unique enchantment on the item held.
    info: '{value} Strength/Enchant'
  lucky_table:
    name: Lucky Table
    desc: Items you enchant using the enchantment table have a {value}% chance of
      upgrading the enchantment level by 1 if not max level.
    info: '{value}% Enchant Upgrade Chance'
  life_essence:
    name: Life Essence
    desc: Instant Health potions heal {value}% more.
    info: +{value}% Instant Health
  healer:
    name: Healer
    desc: Earn {value}% more Healing XP.
    info: +{value}% XP
  life_steal:
    name: Life Steal
    desc: Heal {value}% of the max HP of hostile mobs and players you kill.
    info: Steal {value}% HP
  golden_heart:
    name: Golden Heart
    desc: Damage done to your absorption hearts is reduced by {value}%
    info: -{value}% Absorption Dmg
  revival:
    name: Revival
    desc: Gain +{value} Health and +{value_2} Regeneration for 30 seconds after respawning.
    info: +{value} Health, +{value_2} Regen
    message: <white>You gained a revival bonus for 30 seconds! <white>(<red>+{value}
      Health, <gold>+{value_2} Regeneration<white>)
  disenchanter:
    name: Disenchanter
    desc: Gain {value}% more experience when disenchanting items using a grindstone.
    info: +{value}% Grindstone EXP
  forger:
    name: Forger
    desc: Earn {value}% more Forging XP.
    info: +{value}% XP
  repairing:
    name: Repairing
    desc: Repairing items in an anvil using the raw material the item was made from
      repairs {value}% more durability.
    info: +{value}% Anvil Repair
  anvil_master:
    name: Anvil Master
    desc: Increases the maximum repair cost of an anvil before it is too expensive
      to {value} experience.
    info: '{value} Max Cost'
  skill_mender:
    name: Skill Mender
    desc: Gaining skill XP has a {value}% chance to repair a held item or worn armor
      piece with the Mending enchantment by 1 durability per 2 skill XP.
    info: '{value}% Mend Chance'
acf:
  core:
    permission_denied: '&4&l» <red>Sorry, you don''t have permission to execute this
      command.'
    permission_denied_parameter: '&4&l» <red>Sorry, but you don''t have permission
      to perform this command.'
    error_generic_logged: '&4&l» <red>An error occurred. The issue has been logged.
      Apologies for the inconvenience.'
    unknown_command: '&4&l» <red>Unknown command, please type <yellow>/sk help'
    invalid_syntax: '<yellow>Try: <yellow>{command} <green>{syntax}'
    error_prefix: '<red>Error: {message}'
    error_performing_command: '&4&l» <red>Sorry, an error occurred while executing
      the command.'
    please_specify_one_of: '&4&l» <red>Error: Please specify one of (<yellow>{valid}<red>)'
    must_be_a_number: '&4&l» <red>Error: {num} is not a valid number.'
    must_be_min_length: '&4&l» <red>Error: Must be at least {min} characters long.'
    must_be_max_length: '&4&l» <red>Error: Must be at most {max} characters long.'
    please_specify_at_most: '&4&l» <red>Error: Please specify a value of at most {max}.'
    please_specify_at_least: '&4&l» <red>Error: Please specify a value of at least
      {min}.'
    not_allowed_on_console: '&4&l» <red>Error: The console cannot execute this command.'
    could_not_find_player: '&4&l» <red>Error: No player found with the name: <yellow>{search}'
    no_command_matched_search: <yellow>No command matches <yellow>{search}.
    help_page_information: <aqua> - Showing page <green>{page} <aqua>of <green>{totalpages}
      <aqua>(<yellow>{results}<aqua> results).
    help_no_results: '<aqua>Error: No more results.'
    help_header: <yellow>=== <aqua>Showing help for <green>{commandprefix}{command}<yellow>
      ===
    help_detailed_header: <yellow>=== <aqua>Showing detailed help for <green>{commandprefix}{command}<yellow>
      ===
    help_search_header: <yellow>=== <aqua>Search results for <green>{commandprefix}{command}
      {search}<yellow> ===
  minecraft:
    invalid_world: '<red>Error: This world does not exist.'
    you_must_be_holding_item: '<red>Error: You must be holding an item in your main
      hand.'
    player_is_vanished_confirm: |-
      <yellow>Warning: <green>{vanished} <yellow>is vanished. Don't snitch!
      <yellow>To confirm your action, add <green>:confirm <yellow>at the end of the name.
      <yellow>Example: {vanished}:confirm
    username_too_short: '<red>Error: Username too short, it must be at least 3 characters
      long.'
    is_not_a_valid_name: '<red>Error: <yellow>{name} <red>is not a valid name.'
    multiple_players_match: '<red>Error: Multiple players found <aqua>{search} <yellow>({all})<red>,
      please be more specific.'
    no_player_found_server: <red>No player matching <yellow>{search} <red>is currently
      online on the server.
    no_player_found_offline: <red>No player matching <yellow>{search}<red> was found
      offline.
    no_player_found: <red>No player matching <yellow>{search}<red> was found.
    location_please_specify_world: '<red>Error: Please specify a world. Example: <yellow>world:x,y,z.'
    location_please_specify_xyz: '<red>Error: Please specify coordinates x, y, z.
      Example: <yellow>world:x,y,z.'
    location_console_not_relative: '<red>Error: The console cannot use relative coordinates
      for location.'
commands:
  prefix: ''
  armor:
    modifier:
      add:
        added: '&8&l» &f{color}{stat} modifier &fwith level &b{value} &fhas been added
          to your item'
        already_exists: '&4&l» &cAn armor modifier with the statistic {color}{stat}
          &calready exists! Remove it with &n/sk armor modifier remove'
      remove:
        does_not_exist: '&4&l» &cYour item does not have a modifier for {color}{stat}'
        removed: '&8&l» &f{color}{stat} modifier &fhas been removed from your item'
      list:
        header: '<white>Found armor modifiers:'
      removeall:
        removed: '&8&l» &fAll armor modifiers have been removed from your item'
    multiplier:
      add:
        added: '&8&l» &fThe multiplier <aqua>{target} &fwith value <aqua>{value} &fhas
          been added to your item'
        already_exists: '&4&l» An armor multiplier with the target {target} <red>already
          exists on your armor. Remove it first with &n/sk armor multiplier remove'
        skill_lore: '&fBonus: <aqua>+{value}% {skill} XP'
        skill_lore_subtract: '&fBonus: <aqua>-{value}% {skill} XP'
        global_lore: '&fBonus: <aqua>+{value}% Skill XP'
        global_lore_subtract: '&fBonus: <aqua>-{value}% Skill XP'
      remove:
        does_not_exist: '&4&l» &cYour item does not have an armor multiplier &n{target}'
        removed: '&4&l» &cThe armor multiplier &n{target}&r &chas been removed from
          your item'
      list:
        header: '<white>Found armor multipliers:'
      removeall:
        removed: '&8&l» &fAll armor multipliers have been removed from your item'
    requirement:
      add:
        added: '&8&l» &fThe requirement for &b{skill}&fhas been set for this item
          at <aqua>{level} &flevels'
        already_exists: '&4&l» &cThis item already has a &n{skill}&r &carmor requirement!
          You must remove it first using &n/sk item requirement remove'
        lore: <red>Requires {skill} {level}
      remove:
        does_not_exist: '&4&l» &cYour item does not have a &n{skill}&r &carmor requirement!'
        removed: '&8&l» &b{skill} &farmor requirements have been removed from your
          item'
      list:
        header: '<white>Found armor requirements:'
      removeall:
        removed: '&8&l» &fAll armor requirements have been removed'
      equip: '&4&l» &cYou need {requirements} to use this item'
    trait:
      add:
        already_exists: <yellow>An armor modifier with trait {trait} <yellow>already
          exists on your item! Remove it first with /sk armor trait remove
  backup:
    load:
      confirm: <red>Loading the backup will revert all player data. This action is
        permanent and cannot be undone. You may want to save a backup before loading
        one. Type the command again to confirm this action
      loading: <white>Loading backup...
      loaded: <green>Backup loaded successfully
      error: '<red>Error loading backup: {error}'
      must_be_yaml: <yellow>The file must be in .yml format!
      file_not_found: <green>No backup with this name exists in the backup folder!
    save:
      saving: <white>Saving backup...
      saved: <white>{type} data saved as {file}
      error: <red>Error backing up {type} data! Check the console/log for more details
  claimitems:
    no_items: <yellow>No items to claim
  item:
    give:
      sender: <white>You gave <aqua>{amount}x {key} <white>to {player}
      receiver: <white>You received <aqua>{amount}x {key}
    modifier:
      add:
        added: <gray>Modifier for {color}{stat} <gray>with level <aqua>{value} <gray>has
          been added to your item
        already_exists: <yellow>A modifier with the statistic {color}{stat} <yellow>already
          exists! Remove it with /sk item modifier remove
      remove:
        does_not_exist: <yellow>Your item does not have a modifier for {color}{stat}<yellow>!
        removed: <gray>Modifier for {color}{stat} <gray>has been removed from your
          item
      list:
        header: '<white>Found Item Modifiers:'
      removeall:
        removed: <gray>All modifiers have been removed from your item
    multiplier:
      add:
        added: <gray>The multiplier <aqua>{target} <gray>with value <aqua>{value}
          <gray>has been added to your item
        already_exists: <yellow>A multiplier with the target <aqua>{target} <yellow>already
          exists on your item! Remove it first with /sk item multiplier remove
        skill_lore: '&fBonus: <aqua>+{value}% {skill} XP'
        skill_lore_subtract: '&fBonus: <aqua>-{value}% {skill} XP'
        global_lore: '&fBonus: <aqua>+{value}% Skill XP'
        global_lore_subtract: '&fBonus: <aqua>-{value}% Skill XP'
      remove:
        does_not_exist: <yellow>Your item does not have the multiplier <aqua>{target}<yellow>!
        removed: <gray>The multiplier <aqua>{target} <gray>has been removed from your
          item
      list:
        header: '<white>Found Item Multipliers:'
      removeall:
        removed: <gray>All multipliers have been removed from your item
    register:
      registered: <white>You registered the item with the key {key}
      already_registered: <yellow>An item is already registered with the key <white>{key}<yellow>,
        use <white>/skills item unregister <yellow>to unregister it
      no_spaces: <yellow>The item key cannot contain spaces!
    requirement:
      add:
        added: <dark_aqua>{skill}<gray> item requirement with level <aqua>{level}<gray>
          has been added to your item
        already_exists: <yellow>This item already has a <dark_aqua>{skill}<yellow>
          requirement! Remove it first using <gold>/sk item requirement remove
        lore: '&c» Requires &n{skill} {level} «'
      remove:
        does_not_exist: <yellow>Your item does not have a <dark_aqua>{skill}<yellow>
          requirement!
        removed: <dark_aqua>{skill}<gray> item requirements have been removed from
          your item
      list:
        header: '<white>Found Requirements:'
      removeall:
        removed: <gray>All requirements have been removed from your item
      use: '&cYou do not meet the requirements to use this item: {requirements}'
    unregister:
      unregistered: <white>The item with the key {key} has been unregistered
      not_registered: <white>No item with the key {key} has been registered
    ignore:
      add: <gray>Your item will now be ignored by mana ability interactions
      remove: <gray>Your item will no longer be ignored by mana ability interactions
    trait:
      add:
        already_exists: <yellow>An item modifier with trait {trait} <yellow>already
          exists on your item! Remove it first with /sk item trait remove
  jobs:
    add:
      added: <white>The job {job} was successfully added to player {player}
      limited: <yellow>Cannot add this job because player {player} has reached the
        job limit
      existing: <yellow>Player {player} already has the job {job}
    remove:
      removed: <white>Removed job {job} from player {player}
      unchanged: <yellow>Nothing was changed since player {player} does not have the
        job {job}
    removeall:
      removed: <white>Removed all jobs from player {player}
  lang:
    set: <gray>Language set to <aqua>{lang}
    not_found: <yellow>Language not found!
  mana:
    display: '<white>Your {mana_unit}: <aqua>{current}/{max}'
    display_other: '<white>{player}''s {mana_unit}: <aqua>{current}/{max}'
    add: <gray>Added <aqua>{amount} {mana_unit} <gray>mana points to player <gold>{player}
    remove: <gray>Removed <aqua>{amount} {mana_unit} <gray>from player <gold>{player}
    set: <gray>Set <gold>{player}'s <gray>mana to <aqua>{amount} {mana_unit}
    at_least_zero: <yellow>{mana_unit} must be at least zero!
    console_specify_player: <yellow>The console must specify a player!
  modifier:
    add:
      added: '{color}{stat} <gray>level modifier <aqua>{value} <gray>named <white>{name}
        <gray>added to player <gold>{player}'
      already_exists: '&cA modifier with the name {name} <yellow>already exists for
        player <gold>{player}<yellow>! Remove it with <gold>/sk modifier remove {player}
        {name}'
    remove:
      not_found: <yellow>Modifier {name} <gray>not found for player <gold>{player}
      removed: <gray>Modifier <white>{name} <gray>removed from player <gold>{player}
    list:
      all_stats_header: '<gray>Stat modifiers for player <gold>{player}:'
      all_stats_entry: ' <white>{name} - {color}{stat} <white>Level <gold>{value}'
      one_stat_header: '<gray>Stat modifiers ({color}{stat}<gray>) for player <gold>{player}:'
      one_stat_entry: ' <white>{name} - {color}{stat} <white>Level <gold>{value}'
      players_only: <yellow>Only players can view their own modifiers! Try specifying
        a player.
    removeall:
      removed_all_stats: <gray>Removed <aqua>{num} <gray>stat modifiers from player
        <gold>{player}
      removed_one_stat: <gray>Removed <aqua>{num} {color}{stat} <gray>modifiers from
        player <gold>{player}
      players_only: <yellow>Only players can remove their own modifiers! Try specifying
        a player.
  multiplier:
    global: Global
    list: '<white>Global XP multiplier for <gold>{player}<white>: <aqua>{multiplier}x
      / +{percent}%'
    skill_entry: '<white>Multiplier for <aqua>{skill} <white>XP: <aqua>{multiplier}x
      / +{percent}%'
    players_only: <yellow>Only players can view their own multipliers! Try specifying
      a player!
  preset:
    load:
      confirm: '<red>Loading a preset will overwrite your configuration files! This
        will affect the following files <gray>(<aqua>Added<gray>, <yellow>Merged<gray>,
        <red>Replaced<gray>, <dark_red>Deleted<gray>): {entries} <red>This action
        cannot be undone. Manually back up the necessary files. Type the command again
        to confirm.'
      loaded: Preset {name} successfully loaded, restart the server now.
      created: Created Files
      modified: Modified Files
      replaced: Replaced Files
      deleted: Deleted Files
      skipped: Skipped Files
  profile:
    skills: |-
      Skill Profile for <gold>{name}:
      <gray>UUID: <white>{uuid}
      <gray>Skills:{skill_entries}
    skill_entry: |2-

        <dark_aqua>{skill} <gray>- Level: <white>{level}<gray>, XP: <white>{xp}
    stats: |-
      Stats Profile for <gold>{name}:
      <gray>UUID: <white>{uuid}
      <gray>Stats:{stat_entries}
    stat_entry: |2-

        <dark_aqua>{stat} <gray>- Total Level: <white>{total_level}<gray>, Base Level: <white>{base_level}<gray>, Modified Level: <white>{modified_level}
  rank:
    header: <aqua><bold>Your Skill Ranking</bold>
    power: '<yellow>Power <gray>(All skills): <white>#{rank} of {total}'
    entry: '<aqua>{skill}<gray>: <white>#{rank} of {total}'
  reload: <green>Configuration reloaded!
  save:
    already_saving: <yellow>Data is already being saved!
    mysql_not_enabled: <yellow>MySQL was not enabled on server start, saving to file
      instead!
    saved: <green>Skill data saved!
