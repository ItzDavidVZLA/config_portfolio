mana_abilities:
  replenish:
    name: Replenish
    desc: Automatically replants seeds for {value} seconds. <1>[Right-click with a
      hoe to activate]
    raise: <gray>You raised your hoe
    lower: <gray>You lowered your hoe
    start: <gold>Replenish Activated! <gray>(-{mana} {mana_unit})
    end: <gray>Replenish has worn off
  treecapitator:
    name: Treecapitator
    desc: Instantly chops entire trees for {value} seconds. <1>[Right-click with an
      axe and chop a log to activate]
    raise: <gray>You raised your axe
    lower: <gray>You lowered your axe
    start: <gold>Treecapitator Activated! <gray>(-{mana} {mana_unit})
    end: <gray>Treecapitator has worn off
  speed_mine:
    name: Speed Mine
    desc: Grants Haste {haste_level} for {value} seconds. <1>[Right-click with a pickaxe
      and mine a block to activate]
    raise: <gray>You raised your pickaxe
    lower: <gray>You lowered your pickaxe
    start: <gold>Speed Mine Activated! <gray>(-{mana} {mana_unit})
    end: <gray>Speed Mine has worn off
  absorption:
    name: Absorption
    desc: Incoming damage will reduce mana by 2x Minecraft damage instead of health
      for {value} seconds. Mana regeneration stops while active. <1>[Right-click with
      a shield and take damage to activate]
    raise: <gray>You raised your shield
    lower: <gray>You lowered your shield
    start: <gold>Absorption Activated! <gray>(-{mana} {mana_unit})
    end: <gray>Absorption has worn off
  terraform:
    name: Terraform
    desc: Instantly breaks blocks in a {radius}-block radius on the same layer while
      digging for {value} seconds. <1>[Right-click with a shovel and dig to activate]
    raise: <gray>You raised your shovel
    lower: <gray>You lowered your shovel
    start: <gold>Terraform Activated! <gray>(-{mana} {mana_unit})
    end: <gray>Terraform has worn off
  sharp_hook:
    name: Sharp Hook
    desc: Deals {value} damage to a hooked entity by left-clicking with a fishing
      rod
    use: <gold>Sharp Hook Used! <gray>(-{mana} {mana_unit})
  charged_shot:
    name: Charged Shot
    desc: Arrows deal extra damage based on bow pullback, consuming mana in the process.
      Deals {value}% more damage per mana used. <1>[Left-click with a bow to toggle
      Charged Shot mode]
    enable: <gray>Charged Shot mode is enabled
    disable: <gray>Charged Shot mode is disabled
    shoot: <gold>Charged Shot Used! <light_purple>+{percent}% DAMAGE <gray>(-{mana}
      {mana_unit})
  lightning_blade:
    name: Lightning Blade
    desc: Increases attack speed by {value}% for {duration} seconds. <1>[Right-click
      with a sword and attack an entity to activate]"
    raise: <gray>You prepared your sword
    lower: <gray>You lowered your sword
    start: <gold>Lightning Blade Activated <gray>(-{mana} {mana_unit})
    end: <gray>Lightning Blade has worn off
  not_ready: <red>The ability is not ready! <gray>({cooldown}s)
  not_enough_mana: <yellow>Not enough mana! <gray>(Requires {mana} {mana_unit})
