menu_title: 'Tienda de cristales'
open_command: tiendacristalesench
size: 45

items:
  'libros':
    material: ENCHANTED_BOOK
    item_flags:
    - HIDE_ENCHANTS
    - HIDE_ATTRIBUTES
    slot: 22
    display_name: '&9Experiencia VI'
    lore:
      - '&8Encantamiento'
      - ''
      - '&fGanarás puntos de experiencia'
      - '&fal minar bloques'
      - ''
      - ' &8• &fPrecio: &b100 ❖'
      - ''
      - '&e» ¡Haz clic para comprar! «'
    left_click_requirement:
      requirements:
        dinero:
          type: javascript
          expression: '%ecobits_cristales% >= 100'
          deny_commands:
          - '[message] &4&l» &cNo tienes cristales suficiente para comprar esto.'
          - '[sound] ITEM_BREAK'
    left_click_commands:
      - '[console] ae givebook %player_name% experienciatienda 6 1 50 50'
      - '[console] ecobits take %player_name% cristales 100'
