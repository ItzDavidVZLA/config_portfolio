    - SPEED;1;1
    - HASTE;1;1
    slot: 12
    hide_attributes: true
    hide_effects: true
    hide_enchantments: true
    hide_unbreakable: true
    update: true
    update_interval: 1
    display_name: "&#00BCF5Bebida &8◆ &cCoca Cola ⚡"
    lore:
      - "&8Bebida"
      - ""
      - "&fAdquiere y consume esta bebida para"
      - "&fobtener efectos especiales"
      - ""
      - " &8◆ &fCosto: &690,000 ⛁"
      - " &8◆ &fStock disponible: &b%servervariables_value_tabernabebida1_stock%"
      - ""
      - "&e» ¡Haz clic para comprar! «"
    click_requirement:
      requirements:
        stock:
          type: javascript
          expression: '%servervariables_value_tabernabebida1_stock% >= 1'
          deny_commands:
          - '[message] &6[NPC] &eDayana: &fSe ha acabado el stock de esta bebida. ¡Vuelve mañana!'
          - '[sound] ITEM_BREAK'
        dinero:
          type: javascript
          expression: '%vault_eco_balance% >= 90000'
          deny_commands:
          - '[message] &r &4&l» &cNo tienes monedas suficientes para comprar esto'
    click_commands:
      - '[console] serveritem give cocacola 1 %player_name%'
      - '[console] svar reduce tabernabebida1_stock 1 %player_name%'
      - '[console] eco take %player_name% 90000'
