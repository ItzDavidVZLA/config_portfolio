      item:
        material: BLACK_STAINED_GLASS_PANE
        name: " "
        lore: []
        slot: 30
    3:
      type: CLOSE
      item:
        material: RED_DYE
        name: "&cCerrar"
        lore: []
        slot: 32
    4:
      type: CONSOLE_COMMAND
      item:
        material: ARROW
        name: "&eVolver"
        lore: []
        slot: 31
      commands:
          - "dm open menu_principal %player%"
    6:
      type: CONSOLE_COMMAND
      item:
        material: BLACK_STAINED_GLASS_PANE
        name: " "
