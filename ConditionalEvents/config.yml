  commandInterruptCorrect: '&aActions of event &7%event% &ainterrupted.'
  commandInterruptCorrectPlayer: '&aActions of event &7%event% &ainterrupted for player
    &7%player%&a.'
Events:
  event1:
    type: player_join
    conditions:
    - '%player% == Ajneb'
    actions:
      default:
      - 'to_all: message: &a&l[ALERT] &f&lAjneb joined the game!'
  event2:
    type: block_interact
    one_time: true
    conditions:
    - '%block_x% == 20'
    - '%block_y% == 60'
    - '%block_z% == 20'
    - '%block_world% == lobby'
    - '%block% == STONE_BUTTON'
    - '%action_type% == RIGHT_CLICK'
    - '%player_has_permission_conditionalevents.event.event2% == no execute actions2'
    - '%player% == Ajneb'
    actions:
      default:
      - 'message: &aYou''ve received $500!'
      - 'console_command: eco give %player% 500'
      - 'playsound: ENTITY_PLAYER_LEVELUP;10;2'
      actions2:
      - 'message: &cYou need to have a rank to use this button.'
      one_time:
      - 'message: &cYou can claim this reward just once!'
  event3:
    type: player_attack
    conditions:
    - '%victim% == PLAYER'
    - '%item% == DIAMOND_SWORD'
    - '%item_name% == Super Sword'
    - '%random_1_10% >= 8'
    - '%player% == Ajneb'
    actions:
      default:
      - 'message: &aYour diamond sword poison effect was activated! &6%target:player_name%
        &ais now poisoned!'
      - 'to_target: give_potion_effect: POISON;120;1'
      - 'to_target: message: &cYou were poisoned by &e%player%&c!'
  event4:
    type: block_break
    ignore_with_permission: conditionalevents.ignore.event4
    conditions:
    - '%block_world% == spawn'
    - '%player% == Ajneb'
    actions:
      default:
      - 'cancel_event: true'
      - 'message: &cYou can''t break blocks on this world.'
      - 'playsound: BLOCK_NOTE_BLOCK_PLING;10;0.1'
  event5:
    type: player_command
    ignore_with_permission: conditionalevents.ignore.event5
    conditions:
    - '%main_command% equalsIgnoreCase //calc or %main_command% equalsIgnoreCase //solve
      or %main_command% equalsIgnoreCase //eval'
    actions:
      default:
      - 'cancel_event: true'
  event6:
    type: repetitive
    repetitive_time: 10
    conditions:
    - '%player% == Ajneb'
    - '%player_world% == plotworld'
    - '%player_gamemode% != CREATIVE'
    actions:
      default:
      - 'gamemode: CREATIVE'
      - 'actionbar: &6Changing gamemode to creative.;100'
  event7:
    type: player_command
    conditions:
    - '%main_command% == /hello'
    - '%player% == Ajneb'
    actions:
      default:
      - 'cancel_event: true'
      - 'message: &7You said hello to nearby players!'
      - 'to_range: 10;false: message: &e%player% &7says you hello!'
  netherpe:
    type: player_teleport
    conditions:
    - '%cause% == NETHER_PORTAL or %cause% == END_PORTAL or %cause% == END_GATEWAY'
    - '%player_world% == spawn'
    actions:
      default:
      - 'cancel_event: true'
  noacceso_nether:
    type: repetitive
    repetitive_time: 20
    conditions:
    - '%player_has_permission_logros.ob.12% == no'
    - '%player_world% == world_nether or %player_world% == obnether'
    actions:
      default:
      - 'console_command: spawn %player%'
      - 'message: &4&l» &cNo has desbloqueado el logro &nViaje al Nether&r &cy has
        sido enviado al spawn'
  acceso_netherrr:
    type: repetitive
    repetitive_time: 1
    one_time: true
    conditions:
    - '%player_world% == oneblock_world_nether'
    actions:
      default:
      - 'console_command: lp user %player% permission set logros.ob.12 true server=oneblock21'
  noacceso_end:
    type: repetitive
    repetitive_time: 1
    conditions:
    - '%player_has_permission_essentials.warps.end% == no'
    - '%player_world% == world_the_end or %player_world% == world_the_end2'
    actions:
      default:
      - 'console_command: spawn %player%'
      - 'message: &4&l» &cNo has llegado a &nPlata IV&r &cy has sido enviado al spawn'
  netherpvpnoescapar:
    type: repetitive
    repetitive_time: 1
    conditions:
    - '%player_y% <= 3'
    - '%player_world% == obnether'
    actions:
      default:
      - 'console_command: etp %player% 500.5 100 500.5 '
  taberna_slots:
    type: server_stop
    actions:
      default:
      - 'console_command: svar reset tabernabebida1_stock *'
      - 'console_command: svar reset tabernabebida2_stock *'
      - 'console_command: svar reset tabernabebida3_stock *'
      - 'console_command: svar reset tabernacomida1_stock *'
      - 'console_command: svar reset tabernacomida2_stock *'
      - 'console_command: svar reset tabernacomida3_stock *'
      - 'console_command: svar reset tabernacomida4_stock *'
