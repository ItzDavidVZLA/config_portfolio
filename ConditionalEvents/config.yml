    actions:
      default:
      - 'cancel_event: true'
      - 'message: &r &8&l≡ &f&lLLAVES:'
      - 'message: &r &8◆ &fLlave Común &8» &b%excellentcrates_keys_excellentcrates_comun%'
      - 'message: &r &8◆ &fLlave &aPoco Común &8» &b%excellentcrates_keys_excellentcrates_pococomun%'
      - 'message: &r &8◆ &fLlave &9Rara &8» &b%excellentcrates_keys_excellentcrates_rara%'
      - 'message: &r &8◆ &fLlave &5Épica &8» &b%excellentcrates_keys_excellentcrates_epica%'
      - 'message: &r &8◆ &fLlave &6Legendaria &8» &b%excellentcrates_keys_excellentcrates_legendaria%'
      - 'message: &r &8◆ &fLlave &4Koth &8» &b%excellentcrates_keys_excellentcrates_koth%'
      - 'message: &r &8◆ &fLlave &3Voto &8» &b%excellentcrates_keys_excellentcrates_voto%'
