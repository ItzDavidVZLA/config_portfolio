Events:
  zombieavanzado:
    type: player_kill
    conditions:
    - '%victim% == ZOMBIE'
    - '%victim_name% contains Zombie Avanzado'
    actions:
      default:
      - 'console_command: svar add mm_zombieavanzado_kills 1 %player%'
