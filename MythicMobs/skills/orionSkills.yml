Retirese:
  Cooldown: 20
  Skills:
  - message{m="&c⚠ Atención. &fHas sido lanzado"} @PlayersInRadius{r=20}
  - potion{type=LEVITATION;lvl=10;duration=15} @PlayersInRadius{r=5}
  - damage{a=30}
  - blockwave{duration=40;radius=5;radiusY=5;velocity=10;shape=sphere} @selflocation
  - effect:explosion @Self

ReturnIfOutsideRegion:
  Conditions:
  - region{r=salonbatalla} false
  Skills:
  - teleport{l=291,128,234;world=spawn} @Self

