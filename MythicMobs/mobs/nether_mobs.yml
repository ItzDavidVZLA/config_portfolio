caballero_infernal:
  Type: WITHER_SKELETON
  Display: '&8[&7Nv. <caster.level>&8] &cCaballero Infernal &a<caster.hp{round=0}>&7/&a<caster.mhp{round=0}> &c❤'
  Health: 250
  Damage: 20
  Faction: netherbosses
  Equipment:
  - leather_helmet{color=BLACK} HEAD
  - IRON_SWORD HAND
  Options:
    MovementSpeed: 0.2
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventSunburn: true
  Drops:
  - command{c="sk xp add %player_name% fighting 200"} 
  Skills:
  - setname{n=<caster.name>;delay=2} @self ~onDamaged
