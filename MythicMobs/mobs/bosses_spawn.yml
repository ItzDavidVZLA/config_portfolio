tempest:
  Type: Zombie
  Display: '&8[&7Nv. 50&8] &2Tempest ☢ &a<caster.hp{round=0}>&7/&a<caster.mhp{round=0}> &c❤'
  Health: 5000
  Damage: 10
  Faction: spawnbosses
  Options:
    MovementSpeed: 0.35
    AlwaysShowName: true
    PreventOtherDrops: true
    PreventSunburn: true
  BossBar:
    Enabled: true
    Title: '&8[&7Nv. 50&8] &2Tempest ☢ &a<caster.hp{round=0}>&7/&a<caster.mhp{round=0}> &c❤'
    Range: 20
    Color: BLUE
    Style: SOLID
  AIGoalSelectors: 
  - clear
  - meleeattack 
  - lookatplayers
  AITargetSelectors:
  - clear 
  - players 
  - attacker 
  Equipment:
  - leather_chestplate{color=100,255,50} CHESTPLATE
  - chainmail_leggings LEGS
  - diamond_boots FEET
  - stone_sword HAND
  Drops:
  - command{c="eco give %player_name% 1000000"}
  - command{c="ecobits give %player_name% cristales 200"}
  #- command{c="svar add fragmentoantiguo 32 %player_name%"}
  Skills:
  - setname{n=<caster.name>;delay=2} @self ~onDamaged
  - skill{s=tempest_campoenergetico}
  - skill{s=tempest_antiveneno}
  #- skill{s=tempest_campoenergetico_mensaje}
  #- message{m=TIMER every tick (0.05 seconds)} @World ~onTimer:10000 <30%

